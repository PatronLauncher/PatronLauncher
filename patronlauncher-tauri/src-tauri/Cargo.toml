[package]
name = "patronlauncher-tauri"
version = "1.0.3"
license = "AGPL-3.0-only"
edition = "2024"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"


anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading"] }
webbrowser = "1"
regex = "1"
discord-rich-presence = "1.1"

base64 = "0.22"
tokio = { version = "1", features = ["sync"] }
